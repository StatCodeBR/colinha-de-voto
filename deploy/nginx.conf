# Colinha do Voto: nginx servindo site/dist/ (design D9 da change 02).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml text/plain;

    # Sem scripts, fontes ou estilos de outro domínio. O hash é do único script inline
    # (templates/base.html). Os links de redes sociais e do WhatsApp são navegação, não
    # recursos carregados.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-N9v3EnPaUyp6HvI/g75KoK11mUw7quk1fPSwEhREnaU='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # CSS e JS levam ?v=<hash> nas páginas; fontes não mudam.
    location /static/ {
        expires 30d;
    }

    # Índices usados pela colinha e páginas: curtos, porque o site é atualizado todo dia.
    location / {
        expires 5m;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
