[project]
name = "colinha"
version = "0.1.0"
description = "Colinha do Voto: candidatos a partir de dados abertos do TSE e da Câmara"
authors = [{ name = "StatCode" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[project.scripts]
colinha = "colinha.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".npm-global", "data", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: textos em português usam caracteres "ambíguos" de propósito (ex.: º, –).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
